name: elysium-watch

# Scans Elysium mainnet (chain 99901) every 10 seconds for ~5.5 hours, then starts the next run itself.
# The schedule below is only a backup that restarts the chain if it ever breaks.
# Tracked wallets live in elysium-watch/wallets.json: [{"address":"0x...","label":"name"}].
# To stop everything: disable this workflow in the Actions tab.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: elysium-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # state lives in the Actions cache, so this job never commits to the repo
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: elysium-watch/state.json
          key: ely-state-${{ github.run_id }}
          restore-keys: ely-state-

      - name: Scan Elysium every 10 seconds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CIELO_WALLETS: ${{ secrets.CIELO_WALLETS }}   # packed Cielo list, kept out of the public repo
          WATCH_BOT_TOKEN: ${{ secrets.WATCH_BOT_TOKEN }}   # command bot for /add, /remove, /list
          TRADE_BOT_TOKEN: ${{ secrets.TRADE_BOT_TOKEN }}   # VPS trade bot: alerts come from it with one-tap buy buttons
          GH_API_TOKEN: ${{ github.token }}   # gate.mjs: chain registry lookups on GitHub's API
        run: |
          end=$((SECONDS + 330 * 60))
          # fast lane: tracked-wallet trades within seconds, one long-running process (restarted here if it dies)
          fast() { FAST_MINUTES=$(( (end - SECONDS) / 60 )) node elysium-watch/watch.mjs --fast >> /tmp/fast.log 2>&1 & FAST_PID=$!; }
          : > /tmp/fast.log
          fast
          lines=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            node elysium-watch/watch.mjs > /tmp/scan.log 2>&1 || { echo "scan failed, retrying next tick"; tail -5 /tmp/scan.log; }
            tail -1 /tmp/scan.log
            # the fast lane's 5-minute summaries (counts and timings only)
            now_lines=$(wc -l < /tmp/fast.log); if [ "$now_lines" -gt "$lines" ]; then tail -n +$((lines + 1)) /tmp/fast.log; lines=$now_lines; fi
            if ! kill -0 $FAST_PID 2>/dev/null && [ $((end - SECONDS)) -gt 120 ]; then echo "fast lane stopped, restarting"; fast; fi
            left=$((10 - (SECONDS - start)))
            if [ $left -gt 0 ]; then sleep $left; fi
          done
          kill $FAST_PID 2>/dev/null || true

      - name: Save state
        if: always() && hashFiles('elysium-watch/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: elysium-watch/state.json
          key: ely-state-${{ github.run_id }}

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run elysium-watch.yml --ref ${{ github.ref_name }}
