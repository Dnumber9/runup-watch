name: zero-watch

# LayerZero's Zero ahead of its Nov 30 mainnet: its hosts, LayerZero Scan and the registry, checked every 2 minutes
# for ~5.5 hours, then the run starts the next one itself (GitHub's own cron is too unreliable for this).
# The schedule below is only a backup that restarts the chain if it ever breaks.
# To stop everything: disable this workflow in the Actions tab.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: zero-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # state lives in the Actions cache, so this job never commits to the repo
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: zero-watch/state.json
          key: zero-state-${{ github.run_id }}
          restore-keys: zero-state-

      - name: Check Zero every 2 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_BOT_TOKEN: ${{ secrets.WATCH_BOT_TOKEN }}   # the command bot, second choice for alerts
          TRADE_BOT_TOKEN: ${{ secrets.TRADE_BOT_TOKEN }}   # the trade bot the Elysium alerts come from, first choice
        run: |
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            node zero-watch/watch.mjs || echo "check failed, retrying next tick"
            left=$((120 - (SECONDS - start)))
            if [ $left -gt 0 ]; then sleep $left; fi
          done

      - name: Save state
        if: always() && hashFiles('zero-watch/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: zero-watch/state.json
          key: zero-state-${{ github.run_id }}

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zero-watch.yml --ref ${{ github.ref_name }}
