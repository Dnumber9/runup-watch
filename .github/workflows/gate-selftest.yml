name: gate-selftest

# Checks every source the Ascend/Signal gate watch uses (RPCs, sites, certificates, registry, X) from GitHub's
# runners and prints how the fingerprints score. Run it by hand from the Actions tab; it changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self test
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: node elysium-watch/gate.mjs --selftest
